<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEI Job Portal - Northeast India Jobs</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7778955138168695" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <!-- Logo with ID -->
            <div class="logo" id="logo-home" style="cursor:pointer;">
                <h1><span style="color:#667eea;">NEI</span> Job Portal</h1>
                <p>North East India Jobs • Updated Every Hour</p>
            </div>
            <nav class="navbar">
                <a href="#" id="home-tab" class="active">Home</a>
                <a data-state="assam">Assam</a>
                <a data-state="nagaland">Nagaland</a>
                <a data-state="manipur">Manipur</a>
                <a data-state="meghalaya">Meghalaya</a>
                <a data-state="tripura">Tripura</a>
                <a data-state="sikkim">Sikkim</a>
                <a data-state="arunachal-pradesh">Arunachal Pradesh</a>
                <a data-state="mizoram">Mizoram</a>
            </nav>
        </div>
    </header>

    <!-- HOME DASHBOARD -->
    <div class="home-dashboard" id="home-dashboard">
        <div class="container">
            <div class="dashboard-header">
                <h2>Latest Jobs Across North East India</h2>
                <p>Click any state to view all categories</p>
            </div>
            <div id="home-states-grid"></div>
        </div>
    </div>

    <!-- STATE SECTIONS (hidden initially) -->
    <div id="state-sections" style="display:none;">
        <div class="container">
            <div class="sections-container" id="sections-container"></div>
        </div>
    </div>

    <script src="js/public-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
